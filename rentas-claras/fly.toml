# fly.toml - Fly.io deployment configuration for RentasClaras
#
# Deploy with: fly launch (first time) or fly deploy (updates)
# Set secrets with: fly secrets set KEY=value
#
# Required secrets:
#   - SECRET_KEY (for Flask sessions)
#   - RENTASCLARAS_PIN (for login)
#   - WHATSAPP_ACCESS_TOKEN (for WhatsApp API)
#   - WHATSAPP_PHONE_NUMBER_ID (your WhatsApp Business phone)
#   - WHATSAPP_WEBHOOK_VERIFY_TOKEN (for Meta webhook verification)
#   - WHATSAPP_APP_SECRET (optional, for webhook signature verification)

app = "rentas-claras"
primary_region = "dfw"  # Dallas - good for Mexico

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  FLASK_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Keep running for webhooks
  auto_start_machines = true
  min_machines_running = 1

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  🚨🚨🚨 CRITICAL SECTION - DO NOT DELETE OR MODIFY WITHOUT CARE 🚨🚨🚨   ║
# ║                                                                           ║
# ║  This [mounts] section is REQUIRED for persistent data storage.           ║
# ║  Without it, the SQLite database will be stored in ephemeral container    ║
# ║  storage and ALL DATA WILL BE LOST on every deploy.                       ║
# ║                                                                           ║
# ║  See: docs/INCIDENT_2025_12_29_DATA_LOSS.md                               ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
[mounts]
  source = "clara_data"      # Fly.io volume name (created with: fly volumes create clara_data)
  destination = "/data"       # MUST match DB_PATH in database.py ("/data/rentas_claras.db")

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
